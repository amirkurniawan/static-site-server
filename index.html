<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google KW</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav-links">
            <a href="https://mail.google.com" target="_blank">Gmail</a>
            <a href="https://www.google.com/imghp" target="_blank">Gambar</a>
            <div class="apps-icon" title="Google Apps">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#5f6368" d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z"/>
                </svg>
            </div>
            <a href="#" class="signin-btn">Masuk</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Logo -->
        <div class="logo">
            <span class="logo-g">G</span><span class="logo-o1">o</span><span class="logo-o2">o</span><span class="logo-g2">g</span><span class="logo-l">l</span><span class="logo-e">e</span><span class="logo-kw"> KW</span>
        </div>

        <!-- Search Box -->
        <form class="search-form" action="https://www.google.com/search" method="GET" target="_blank">
            <div class="search-box">
                <div class="search-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </div>
                <input type="text" name="q" class="search-input" placeholder="Telusuri Google KW atau ketik URL" autocomplete="off" autofocus>
                <div class="voice-icon" title="Penelusuran Suara">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="#4285f4" d="M12 15c1.66 0 2.99-1.34 2.99-3L15 6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3z"/>
                        <path fill="#34a853" d="M11 18.92h2V22h-2z"/>
                        <path fill="#f4b400" d="M7 12H5c0 2.76 2.24 5 5 5v-2c-1.66 0-3-1.34-3-3z"/>
                        <path fill="#ea4335" d="M17 12c0 1.66-1.34 3-3 3v2c2.76 0 5-2.24 5-5h-2z"/>
                    </svg>
                </div>
                <div class="camera-icon" title="Telusuri dengan gambar">
                    <svg viewBox="0 0 192 192" width="24" height="24">
                        <rect fill="none" height="192" width="192"/>
                        <g>
                            <circle fill="#34a853" cx="144" cy="144" r="16"/>
                            <circle fill="#4285f4" cx="96" cy="48" r="16"/>
                            <circle fill="#ea4335" cx="48" cy="144" r="16"/>
                            <path fill="#4285f4" d="M96,16c26.51,0,48,21.49,48,48c0,26.51-21.49,48-48,48"/>
                            <path fill="#ea4335" d="M48,96c-26.51,0-48,21.49-48,48c0,26.51,21.49,48,48,48"/>
                            <path fill="#34a853" d="M144,96c26.51,0,48,21.49,48,48c0,26.51-21.49,48-48,48"/>
                        </g>
                    </svg>
                </div>
            </div>

            <!-- Buttons -->
            <div class="search-buttons">
                <button type="submit" class="search-btn">Google KW Search</button>
                <button type="button" class="lucky-btn" onclick="window.open('https://www.google.com/doodles', '_blank')">Saya Lagi Beruntung</button>
            </div>
        </form>

        <!-- Language -->
        <div class="language">
            Google tersedia dalam: <a href="#">English</a> <a href="#">Basa Jawa</a> <a href="#">Basa Sunda</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-top">
            <span>Indonesia</span>
        </div>
        <div class="footer-bottom">
            <div class="footer-left">
                <a href="#">Tentang</a>
                <a href="#">Iklan</a>
                <a href="#">Bisnis</a>
                <a href="#">Cara Kerja Penelusuran</a>
            </div>
            <div class="footer-right">
                <a href="#">Privasi</a>
                <a href="#">Persyaratan</a>
                <a href="#">Setelan</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
